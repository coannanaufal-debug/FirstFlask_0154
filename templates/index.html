<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Greeting App | Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="shell">
        <section class="card">
            <div class="topbar"></div>
            <div class="content">
                <div>
                    <span class="eyebrow">First Project Flask</span>
                    <h1>Selamat datang!</h1>
                    <p class="subtitle">Tulis nama kamu untuk mencoba aplikasi web sederhana yang dibuat menggunakan Flask.</p>
                    <form method="post" autocomplete="off">
                        <input type="text" name="name" aria-label="Nama kamu" placeholder="Masukkan nama kamu" autofocus>
                        <button type="submit">Mulai</button>
                    </form>
                </div>
                <div class="badge" aria-hidden="true"><span>F</span></div>
            </div>
        </section>
    </main>
</body>
</html>
